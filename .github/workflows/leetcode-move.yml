name: Move LeetCode Solutions

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "[0-9][0-9][0-9][0-9]-*/**"

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move LeetCode solutions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p LeetCode

          found=false

          for directory in [0-9][0-9][0-9][0-9]-*; do
            if [[ ! -d "$directory" ]]; then
              continue
            fi

            echo "Moving $directory to LeetCode/$directory"

            # 같은 문제를 다시 제출해 기존 폴더가 있더라도 안전하게 병합
            mkdir -p "LeetCode/$directory"
            cp -a "$directory/." "LeetCode/$directory/"
            rm -rf "$directory"

            found=true
          done

          if [[ "$found" == false ]]; then
            echo "No root-level LeetCode directories found."
          fi

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: move LeetCode solution into LeetCode directory"
          git push origin HEAD:main
