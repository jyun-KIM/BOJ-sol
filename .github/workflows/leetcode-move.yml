name: Move LeetCode Solutions

on:
  push:
    branches:
      - main
    paths:
      - "[0-9][0-9][0-9][0-9]-*/**"

  workflow_dispatch:

permissions:
  contents: write

# 여러 LeetCode 업로드가 연속으로 발생하면 동시에 실행하지 않음
concurrency:
  group: move-leetcode-solutions
  cancel-in-progress: false

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move LeetCode solutions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p LeetCode

          moved=false

          for directory in [0-9][0-9][0-9][0-9]-*; do
            if [[ ! -d "$directory" ]]; then
              continue
            fi

            echo "Moving $directory"

            mkdir -p "LeetCode/$directory"
            cp -a "$directory/." "LeetCode/$directory/"
            rm -rf "$directory"

            moved=true
          done

          if [[ "$moved" == false ]]; then
            echo "No root-level LeetCode directories found."
          fi

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: move LeetCode solutions to LeetCode folder"

      - name: Rebase and push
        shell: bash
        run: |
          set -euo pipefail

          # checkout 이후 원격 main이 바뀌었을 수 있으므로 최신 상태 반영
          git pull --rebase origin main

          git push origin HEAD:main
